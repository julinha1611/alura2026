<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech</title>
    <!-- Certifique-se de que o arquivo CSS tenha este nome -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- O Container agrupa tudo para criar o efeito de "cartão" centralizado -->
    <div class="container">
        
        <header class="banner">
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
        </header>

        <!-- A Content-area dá o espaçamento interno (padding) nas laterais -->
        <main class="content-area">
            
            <!-- A logo agora está limitada pelo max-width do CSS -->
            <img src="logo.jpg" alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">

            <article class="post">
                <h2>Meu primeiro post</h2>
                <p class="autor">Por: <strong>Julia Dorociaki</strong></p>
                <p class="conteudo">
                    Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação 
                    e curiosidades da área de tecnologia.
                </p>
            </article>

        </main>
    </div>

</body>
</html>
